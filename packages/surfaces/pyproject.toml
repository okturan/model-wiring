[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-wiring-surfaces"
version = "0.1.0"
description = "CLI, ANSI TUI, and web model/provider selection primitives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["model-wiring>=0.1,<0.2"]

[project.scripts]
model-wiring-ui = "model_wiring_surfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_wiring_surfaces = ["web/*.js", "web/*.css", "web/*.html"]

[tool.uv.sources]
model-wiring = { workspace = true }
