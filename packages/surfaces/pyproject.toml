[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-wiring-surfaces"
version = "0.1.0"
description = "CLI, ANSI TUI, and web model/provider selection primitives"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Okan Erturan" }]
keywords = ["llm", "provider", "tui", "web-component", "selection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = ["model-wiring-core>=0.1,<0.2"]

[project.urls]
Homepage = "https://github.com/okturan/model-wiring"
Repository = "https://github.com/okturan/model-wiring"
Issues = "https://github.com/okturan/model-wiring/issues"

[project.scripts]
model-wiring-ui = "model_wiring_surfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_wiring_surfaces = ["web/*.js", "web/*.css", "web/*.html"]

[tool.uv.sources]
model-wiring-core = { workspace = true }
