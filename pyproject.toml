[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Installing the repository root installs the whole kit, so a new user never
# has to know that the code lives under packages/.
[project]
name = "model-wiring"
version = "0.1.0"
description = "Wire any AI workflow app to models, providers, credentials, and selection surfaces"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Okan Erturan" }]
keywords = ["llm", "provider", "catalog", "oauth", "credentials", "selection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "model-wiring-core==0.1.0",
    "model-wiring-surfaces==0.1.0",
]

[project.optional-dependencies]
keyring = ["model-wiring-core[keyring]==0.1.0"]

[project.scripts]
model-wiring-pick = "model_wiring_surfaces.cli:main"

[project.urls]
Homepage = "https://github.com/okturan/model-wiring"
Repository = "https://github.com/okturan/model-wiring"
Issues = "https://github.com/okturan/model-wiring/issues"

[tool.setuptools]
# Metapackage: the code ships in the workspace members it depends on.
packages = []

[tool.uv.workspace]
members = ["packages/core", "packages/surfaces"]

[tool.uv.sources]
model-wiring-core = { workspace = true }
model-wiring-surfaces = { workspace = true }
