[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-provider-kit"
version = "0.1.0"
description = "Provider, model, credential, and billing-route selection for AI applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
keyring = ["keyring>=25,<27"]

[project.scripts]
model-provider = "model_provider.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_provider = ["data/*.json"]
